name: Release Fleet Desktop
run-name: "release ${{ github.event.client_payload.source_sha }} [${{ github.event.client_payload.dispatch_id }}]"

on:
  repository_dispatch:
    types: [release]

concurrency:
  group: release-fleet-desktop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: windows-latest
    env:
      FLEET_RELEASE_SOURCE_REPOSITORY: ${{ github.event.client_payload.repo }}
      FLEET_RELEASE_SOURCE_REVISION: ${{ github.event.client_payload.source_sha }}
      FLEET_RELEASE_SOURCE_REF: ${{ github.event.client_payload.source_ref }}
      FLEET_RELEASE_TAG: ${{ github.event.client_payload.tag }}
      FLEET_REQUIRE_RELEASE_PROVENANCE: "1"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout exact private source ref
        uses: actions/checkout@v5
        with:
          repository: Infinity-light/fleet
          ref: ${{ github.event.client_payload.source_sha }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Verify source commit binding
        shell: bash
        run: |
          test "${{ github.event.client_payload.repo }}" = "Infinity-light/fleet"
          test "${{ github.event.client_payload.contract_version }}" = "1"
          test "${{ github.event.client_payload.dispatch_mode }}" = "full-pipeline"
          test "${{ github.event.client_payload.tag }}" = "${{ github.event.client_payload.source_ref }}"
          test "${{ github.event.client_payload.surfaces[0] }}" = "desktop_distribution"
          test "$(git rev-parse HEAD)" = "${{ github.event.client_payload.source_sha }}"
          git fetch --force origin "refs/tags/${{ github.event.client_payload.tag }}:refs/tags/${{ github.event.client_payload.tag }}"
          test "$(git rev-parse 'refs/tags/${{ github.event.client_payload.tag }}^{}')" = "${{ github.event.client_payload.source_sha }}"
          echo "FLEET_RELEASE_TIMESTAMP=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: Install WeChat database test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: pycryptodome==3.23.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from Crypto.Cipher import AES; print('PyCryptodome AES ready')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Node 22 runners can ship an older npm client that still calls the
      # retired registry `audits/quick` endpoint. Pin npm 11 so every install
      # and audit uses the supported bulk advisory API consistently.
      - name: Pin npm audit client
        run: npm install --global npm@11.5.1

      - name: Install backend dependencies
        # better-sqlite3 13 and node-pty ship the audited Windows prebuilds used
        # by Fleet. Avoid runner-local node-gyp/Visual Studio coupling; the
        # backend tests and packaged Electron probe load the real binaries.
        run: npm ci --ignore-scripts

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Install and audit bundled web console dependencies
        working-directory: web
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test and build bundled backend
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test and build bundled web console
        working-directory: web
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test visible model-source UI paths
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --import tsx scripts/e2e-model-source.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Audit desktop production dependencies
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Test desktop startup, updater, and autostart logic
        working-directory: desktop
        run: npm test

      - name: Test release tooling
        run: node scripts/release/run-tests.mjs

      - name: Verify desktop release version
        id: version
        run: node scripts/release/check-version.mjs --github-output

      - name: Verify release tag matches desktop version
        run: >-
          node scripts/release/check-version.mjs
          --expected-tag "${{ github.event.client_payload.tag }}"

      - name: Assemble verified bundled backend, web, and CPA
        run: node scripts/build-desktop-staging.mjs --skip-build

      - name: Verify staged bundled runtime
        run: node scripts/release/verify-bundled-runtime.mjs --root build-staging

      - name: Build portable exe
        working-directory: desktop
        run: npm run package

      - name: Verify executable metadata
        run: >-
          node scripts/release/verify-exe-version.mjs
          --exe desktop/dist/Fleet.exe
          --version "${{ steps.version.outputs.version }}"

      - name: Verify packaged desktop resources
        run: node scripts/release/verify-packaged-desktop.mjs --resources desktop/dist/win-unpacked/resources

      - name: Smoke test real portable startup and single-instance activation
        shell: powershell
        run: >-
          ./scripts/release/smoke-desktop.ps1
          -Exe desktop/dist/Fleet.exe

      - name: Smoke test installed updater migration and rollback scenarios
        run: node scripts/release/smoke-installed-updater.mjs --exe desktop/dist/Fleet.exe

      - name: Smoke test packaged backend and native modules
        run: node scripts/release/smoke-bundled-backend.mjs --exe desktop/dist/win-unpacked/Fleet.exe

      - name: Smoke test real CPA isolation and authentication
        run: node scripts/release/smoke-cpa.mjs --exe desktop/dist/win-unpacked/resources/bin/cli-proxy-api.exe

      - name: Prepare release artifacts
        run: >-
          node scripts/release/prepare-artifacts.mjs
          --exe desktop/dist/Fleet.exe
          --out release-staging
          --version "${{ steps.version.outputs.version }}"
          --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.event.client_payload.tag }}"

      - name: Verify prepared artifacts
        run: >-
          node scripts/release/verify-artifacts.mjs
          --dir release-staging
          --version "${{ steps.version.outputs.version }}"

      - name: Preflight immutable public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/publish-github-release.mjs preflight
          --dir release-staging
          --repo "${{ github.repository }}"
          --tag "${{ github.event.client_payload.tag }}"
          --version "${{ steps.version.outputs.version }}"

      - name: Publish verified public release assets
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/publish-github-release.mjs publish
          --dir release-staging
          --repo "${{ github.repository }}"
          --tag "${{ github.event.client_payload.tag }}"
          --version "${{ steps.version.outputs.version }}"

      # GitHub Release is the CDN-backed desktop carrier source. Publish it
      # before activating latest.json so an updater can never observe a
      # manifest that points to a missing asset. The production host retains a
      # verified copy for rollback, but CI and clients no longer pull it
      # through Alibaba Cloud CDT.
      - name: Publish verified release to production
        id: production_release
        shell: powershell
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: >-
          ./scripts/release/publish-desktop.ps1
          -Version "${{ steps.version.outputs.version }}"
          -ServerHost "${{ secrets.SERVER_HOST }}"
          -ServerUser "${{ secrets.SERVER_USER }}"

      - name: Preserve release evidence for every terminal outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.event.client_payload.dispatch_id }}
          path: |
            release-staging/release-attestation-*.json
            release-staging/release-ledger-*.jsonl
            release-staging/release-ledger-*.json
          if-no-files-found: warn
