name: Deploy Fleet Web

on:
  repository_dispatch:
    types: [deploy, deploy-web]

concurrency:
  group: deploy-beidou-web
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact private source ref
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}

      - name: Verify source commit binding
        run: test "$(git rev-parse HEAD)" = "${{ github.event.client_payload.source_sha }}"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and audit
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          npm test
          npx tsc --noEmit
          npm run build
          test -f dist/index.html

      - name: Upload to staging dir
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "web/dist/*"
          target: /var/www/beidou-staging
          strip_components: 2
          rm: true

      - name: Upload Nginx configuration candidate
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/nginx/beidou.godpenai.com.conf"
          target: /tmp/fleet-nginx-staging
          strip_components: 2
          rm: true

      - name: Atomic swap Web and validated Nginx configuration
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            test -f /var/www/beidou-staging/index.html
            test -f /tmp/fleet-nginx-staging/beidou.godpenai.com.conf
            rsync -a --delete --exclude releases /var/www/beidou-staging/ /var/www/beidou/
            rm -rf /var/www/beidou-staging
            nginx_config=/etc/nginx/conf.d/beidou.godpenai.com.conf
            nginx_backup="${nginx_config}.fleet-backup"
            cp "$nginx_config" "$nginx_backup"
            install -m 0644 /tmp/fleet-nginx-staging/beidou.godpenai.com.conf "$nginx_config"
            if ! nginx -t; then
              mv -f "$nginx_backup" "$nginx_config"
              nginx -t
              exit 1
            fi
            rm -f "$nginx_backup"
            rm -rf /tmp/fleet-nginx-staging
            nginx -s reload

      - name: Verify live site serves this build
        run: |
          want=$(grep -o 'assets/index[^"]*\.js' web/dist/index.html | head -1)
          got=$(curl -s --max-time 15 https://beidou.godpenai.com/ | grep -o 'assets/index[^"]*\.js' | head -1)
          test -n "$want"
          test "$want" = "$got"
          curl -sf --max-time 15 "https://beidou.godpenai.com/$want" -o /dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://beidou.godpenai.com/releases/not-a-real-fleet-build.exe)" = "404"
