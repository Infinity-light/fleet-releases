name: Deploy Fleet Web

on:
  repository_dispatch:
    types: [deploy]

concurrency:
  group: deploy-beidou-web
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact private source ref
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}

      - name: Verify source commit binding
        run: test "$(git rev-parse HEAD)" = "${{ github.event.client_payload.source_sha }}"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and audit
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          npm test
          npx tsc --noEmit
          npm run build
          test -f dist/index.html

      - name: Upload to staging dir
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "web/dist/*"
          target: /var/www/beidou-staging
          strip_components: 2
          rm: true

      - name: Atomic swap into /var/www/beidou
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            test -f /var/www/beidou-staging/index.html
            rsync -a --delete --exclude releases /var/www/beidou-staging/ /var/www/beidou/
            rm -rf /var/www/beidou-staging

      - name: Verify live site serves this build
        run: |
          want=$(grep -o 'assets/index[^"]*\.js' web/dist/index.html | head -1)
          got=$(curl -s --max-time 15 https://beidou.godpenai.com/ | grep -o 'assets/index[^"]*\.js' | head -1)
          test -n "$want"
          test "$want" = "$got"
          curl -sf --max-time 15 "https://beidou.godpenai.com/$want" -o /dev/null
